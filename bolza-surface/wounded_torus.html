<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Wounded Torus — Gash from Octagon Cut</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#08080c; overflow:hidden; font-family:'Courier New',monospace; }
#info { position:absolute; top:12px; left:16px; color:#8899aa; font-size:13px; line-height:1.6; pointer-events:none; }
#info h2 { color:#ccd0d8; font-size:16px; margin-bottom:4px; font-weight:normal; }
#info .n { color:#e8b84d; }
</style>
</head><body>

<div id="info">
  <h2>Wounded Torus</h2>
  The octagon cut V₀→V₄ becomes a <span class="n">gash</span> on each torus.<br>
  <span style="color:#ff4444">Red curve</span> = gash (free boundary)<br>
  Left: handle 1 (a₁b₁) · Right: handle 2 (a₂b₂)<br>
  Glue the two gashes together → genus-2 surface
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080c);
const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
cam.position.set(0, 4, 8);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setSize(innerWidth, innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(ren.domElement);
const ctl = new OrbitControls(cam, ren.domElement);
ctl.enableDamping = true; ctl.dampingFactor = 0.05;
ctl.autoRotate = true; ctl.autoRotateSpeed = 0.4;

scene.add(new THREE.AmbientLight(0x556677, 0.6));
let l;
l = new THREE.DirectionalLight(0xffeedd, 1.0); l.position.set(5,8,5); scene.add(l);
l = new THREE.DirectionalLight(0x99aacc, 0.4); l.position.set(-4,2,-3); scene.add(l);
l = new THREE.DirectionalLight(0x8899bb, 0.3); l.position.set(0,-4,5); scene.add(l);

const R = 1.3;  // major radius
const r = 0.5;  // minor radius
const sep = 2.2; // separation between the two tori

function torusPoint(u, v, handle) {
  // u, v in [0, 2π], handle 0=left, 1=right
  // Match Three.js TorusGeometry convention: major circle in x-y, z = tube vertical
  const offset = handle === 0 ? -sep : sep;
  return new THREE.Vector3(
    offset + (R + r * Math.cos(v)) * Math.cos(u),
    (R + r * Math.cos(v)) * Math.sin(u),
    r * Math.sin(v)
  );
}

// ── Build both tori ──
const torusMat = new THREE.MeshPhongMaterial({
  color: 0x5a6a80, side: THREE.DoubleSide, shininess: 25,
  transparent: true, opacity: 0.7
});

for (let h = 0; h < 2; h++) {
  const offset = h === 0 ? -sep : sep;

  // Surface
  const tg = new THREE.TorusGeometry(R, r, 48, 96);
  const tm = new THREE.Mesh(tg, torusMat);
  tm.position.x = offset;
  scene.add(tm);

  // Grid
  const NGRID = 8;
  for (let i = 0; i <= NGRID; i++) {
    const pts1 = [];
    for (let j = 0; j <= 64; j++) pts1.push(torusPoint(2*Math.PI*i/NGRID, 2*Math.PI*j/64, h));
    scene.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts1),
      new THREE.LineBasicMaterial({ color: 0x334455, transparent: true, opacity: 0.3 })
    ));
    const pts2 = [];
    for (let j = 0; j <= 128; j++) pts2.push(torusPoint(2*Math.PI*j/128, 2*Math.PI*i/NGRID, h));
    scene.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts2),
      new THREE.LineBasicMaterial({ color: 0x334455, transparent: true, opacity: 0.3 })
    ));
  }

  // a-loop — blue
  {
    const pts = [];
    for (let j = 0; j <= 128; j++) pts.push(torusPoint(2*Math.PI*j/128, 0, h));
    const curve = new THREE.CatmullRomCurve3(pts, true);
    scene.add(new THREE.Mesh(
      new THREE.TubeGeometry(curve, 128, 0.018, 8, true),
      new THREE.MeshPhongMaterial({ color: 0x4488ff, emissive: 0x112244 })
    ));
  }

  // b-loop — green
  {
    const pts = [];
    for (let j = 0; j <= 64; j++) pts.push(torusPoint(0, 2*Math.PI*j/64, h));
    const curve = new THREE.CatmullRomCurve3(pts, true);
    scene.add(new THREE.Mesh(
      new THREE.TubeGeometry(curve, 64, 0.018, 8, true),
      new THREE.MeshPhongMaterial({ color: 0x44cc66, emissive: 0x113322 })
    ));
  }
}

// ── THE GASH — the octagon cut mapped to torus coordinates ──
// From the computation:
// t=0: (u,v) = (0, 0)           → P (start)
// t=1: (u,v) = (-1.414, 0.773)  → V₄ (end)
// Path: u(t) = -1.4142 * t, v(t) follows the bilinear curve
// (approximately linear: v(t) ≈ 0.773 * t with slight curvature)

// Precomputed gash curve from wounded_tori.py
const gashUV = [
  [0.0000, 0.0000], [-0.0707, 0.0679], [-0.1414, 0.1306], [-0.2121, 0.1887],
  [-0.2828, 0.2426], [-0.3536, 0.2929], [-0.4243, 0.3398], [-0.4950, 0.3837],
  [-0.5657, 0.4249], [-0.6364, 0.4636], [-0.7071, 0.5000], [-0.7778, 0.5343],
  [-0.8485, 0.5668], [-0.9192, 0.5975], [-0.9899, 0.6266], [-1.0607, 0.6542],
  [-1.1314, 0.6804], [-1.2021, 0.7054], [-1.2728, 0.7291], [-1.3435, 0.7518],
  [-1.4142, 0.7735]
];

// Draw gash on both tori
for (let h = 0; h < 2; h++) {
  const pts = [];
  for (let i = 0; i < gashUV.length - 1; i++) {
    for (let k = 0; k < 8; k++) {
      const t = k / 8;
      const u = (1-t)*gashUV[i][0] + t*gashUV[i+1][0];
      const v = (1-t)*gashUV[i][1] + t*gashUV[i+1][1];
      pts.push(torusPoint(u * 2*Math.PI, v * 2*Math.PI, h));
    }
  }
  const lastUV = gashUV[gashUV.length-1];
  pts.push(torusPoint(lastUV[0]*2*Math.PI, lastUV[1]*2*Math.PI, h));

  const curve = new THREE.CatmullRomCurve3(pts, false);
  scene.add(new THREE.Mesh(
    new THREE.TubeGeometry(curve, 160, 0.03, 8, false),
    new THREE.MeshPhongMaterial({ color: 0xff3333, emissive: 0x441111 })
  ));

  // Endpoints
  const dotGeo = new THREE.SphereGeometry(0.055, 16, 16);
  const startDot = new THREE.Mesh(dotGeo, new THREE.MeshPhongMaterial({ color: 0xffff44, emissive: 0x444400 }));
  startDot.position.copy(torusPoint(0, 0, h));
  scene.add(startDot);

  const endDot = new THREE.Mesh(dotGeo.clone(), new THREE.MeshPhongMaterial({ color: 0xff8844, emissive: 0x442200 }));
  endDot.position.copy(torusPoint(lastUV[0]*2*Math.PI, lastUV[1]*2*Math.PI, h));
  scene.add(endDot);
}

window.addEventListener('resize', () => {
  cam.aspect = innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  ctl.update();
  ren.render(scene, cam);
})();
</script>
</body></html>
